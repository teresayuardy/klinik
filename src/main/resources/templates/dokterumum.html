<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Klinik Tarumanagara</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="/dashboard">KLINIK TARUMANAGARA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="/dashboard">HOME</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">PILIH SPESIALISASI</a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/dokterumum">Dokter Umum</a></li>
                            <li><a class="dropdown-item" href="/doktergigi">Dokter Gigi</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">PROFILE</a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/informasiakun">Informasi Akun</a></li>
                            <li>
                                <hr class="dropdown-divider" />
                            </li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Header-->
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Dokter Umum</h1>
                <p class="lead fw-normal text-white-50 mb-0">Klinik Tarumanagara</p>
            </div>
        </div>
    </header>
    <!-- Section-->
    <section class="py-5">
        <div class="row justify-content-center row-cols-1 row-cols-md-3 g-4">
            <!-- Loop dokter -->
            <th:block th:each="dokter : ${dokterList}">
                <div class="col mb-5">
                    <div class="card h-100">

                        <!-- Badge -->
                        <div class="badge bg-dark text-white position-absolute" style="top: 0.5rem; right: 0.5rem">
                            Umum
                        </div>

                        <!-- Detail Dokter -->
                        <div class="card-body p-4">
                            <div class="text-center">

                                <!-- Nama Dokter -->
                                <h5 class="fw-bolder" th:text="${dokter.nama}"></h5>

                                <!-- ID Dokter -->
                                <p class="mb-1" th:text="'ID: ' + ${dokter.idDokter}"></p>

                                <!-- Umur -->
                                <p class="mb-1" th:text="'Umur: ' + ${dokter.umur} + ' tahun'"></p>

                                <!-- Telepon -->
                                <p class="mb-1" th:text="'Nomor Telepon: ' + ${dokter.telp}"></p>

                                <!-- Ruang Praktik -->
                                <p class="mb-1" th:text="'Ruang Praktik: ' + ${dokter.ruangPraktik}"></p>

                                <!-- Tarif -->
                                <p class="fw-bold text-success" th:text="'Tarif: Rp' + ${dokter.tarif}"></p>

                                <!-- Bisa Merujuk (khusus DokterUmum) -->
                                <p th:text="${dokter.sMerujuk} + ' Merujuk'"></p>
                            </div>
                        </div>

                        <!-- Tombol -->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center">
                                <a class="btn btn-outline-dark mt-auto" th:href="@{/keluhan(idDokter=${dokter.idInsan})}">Pilih Dokter</a>
                            </div>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

    </section>
    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; ELLYA, CARLO, TERESA Object Based Programming 2025
            </p>
        </div>
    </footer>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
</body>

</html>
