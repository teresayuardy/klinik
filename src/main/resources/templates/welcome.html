<html>

<head>
    <title>Klinik Tarumanagara</title>
    <link rel="stylesheet" th:href="@{/css/welcome.css}">
</head>

<body>
    <div class="form-group">
        <h2>Selamat Datang di Klinik Tarumanagara</h2>

        <p>Jika Anda telah memiliki akun, pilih:</p>
        <form th:action="@{/login}" method="get">
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p>Jika Anda belum memiliki akun, pilih:</p>
        <form th:action="@{/register}" method="get" style="margin-top:10px;">
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
    </div>
</body>
</html>
